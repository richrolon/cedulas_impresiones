<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador PDF Cédula - Rich Rolon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        h2 { margin-top: 0; color: #0056b3; }
        .info { font-size: 0.9em; color: #666; margin-bottom: 20px; line-height: 1.4; }

        /* Estilo para las secciones de subida */
        .upload-card { margin-bottom: 20px; text-align: left; }
        .upload-card strong { display: block; margin-bottom: 8px; color: #007bff; }

        /* Contenedor del Botón con Esquema de Fondo */
        .upload-btn-wrapper {
            position: relative;
            width: 100%;
            height: 150px; /* Altura del botón/guía */
            border: 2px dashed #ccc;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f8fbff;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-btn-wrapper:hover {
            border-color: #007bff;
            background-color: #eef5ff;
        }

        /* Imagen Esquivmática de Fondo */
        .esquema-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover; /* o contain, dependiendo del esquema */
            background-position: center;
            opacity: 0.3; /* Hace el esquema semi-transparente */
            z-index: 1;
        }

        /* Asignar las imágenes específicas a cada botón */
        #frontWrapper .esquema-overlay {
            background-image: url('esquema_frontal.png');
        }

        #backWrapper .esquema-overlay {
            background-image: url('esquema_posterior.png');
        }

        /* Texto de instrucción superpuesto */
        .upload-text {
            position: relative;
            z-index: 2; /* Por encima del esquema */
            font-weight: bold;
            color: #007bff;
            pointer-events: none; /* No interfiere con el clic */
        }

        /* Input de archivo oculto que cubre todo el botón */
        .upload-btn-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; /* Lo hace invisible pero funcional */
            cursor: pointer;
            z-index: 3; /* Por encima de todo */
        }

        /* Vista previa de la imagen subida (reemplaza al esquema) */
        .preview-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ajusta la imagen sin deformarla */
            display: none; /* Oculta hasta que se sube una imagen */
            z-index: 4; /* Por encima de todo, excepto el texto */
        }

        /* Seccion de Filtro y Botón Final */
        .controls-section { margin-top: 30px; text-align: left; }
        .controls-section label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; cursor: pointer; }
        
        button { width: 100%; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        
        #generateBtn { background: #28a745; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #generateBtn:hover:not(:disabled) { background: #218838; }
        #generateBtn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        .bn-filter { filter: grayscale(100%); }
        .success-text { color: #28a745; font-size: 0.8em; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Impresión de Cédula A4</h2>
    <p class="info">Utiliza los esquemas como guía visual. Sube las fotos de tu cámara o galería.</p>

    <div class="upload-card">
        <strong>📸 Lado Frontal</strong>
        <div id="frontWrapper" class="upload-btn-wrapper">
            <div class="esquema-overlay"></div>
            <span class="upload-text">Seleccionar Foto</span>
            <input type="file" id="frontInput" accept="image/*">
            <img id="frontPreview" class="preview-img">
        </div>
        <div id="frontSuccess" class="success-text">✅ Imagen cargada</div>
    </div>

    <div class="upload-card">
        <strong>📸 Lado Posterior</strong>
        <div id="backWrapper" class="upload-btn-wrapper">
            <div class="esquema-overlay"></div>
            <span class="upload-text">Seleccionar Foto</span>
            <input type="file" id="backInput" accept="image/*">
            <img id="backPreview" class="preview-img">
        </div>
        <div id="backSuccess" class="success-text">✅ Imagen cargada</div>
    </div>

    <div class="controls-section">
        <label><b>Modo de Impresión:</b></label>
        <select id="colorMode">
            <option value="color">A Color</option>
            <option value="bw">Blanco y Negro</option>
        </select>

        <button id="generateBtn" disabled>Generar PDF A4 Vertical</button>
    </div>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let frontImg = null;
    let backImg = null;

    // Función para leer y mostrar la imagen subida
    function handleFile(input, previewId, successId) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            // Mostrar la vista previa y ocultar el esquema
            const preview = document.getElementById(previewId);
            preview.src = e.target.result;
            preview.style.display = 'block';
            
            // Ocultar el texto de instrucción
            input.parentElement.querySelector('.upload-text').style.display = 'none';

            // Mostrar mensaje de éxito
            document.getElementById(successId).style.display = 'block';

            // Guardar la imagen en base64
            if (previewId === 'frontPreview') frontImg = e.target.result;
            else backImg = e.target.result;

            // Habilitar botón si ambas fotos están listas
            if (frontImg && backImg) document.getElementById('generateBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('frontInput').onchange = (e) => handleFile(e.target, 'frontPreview', 'frontSuccess');
    document.getElementById('backInput').onchange = (e) => handleFile(e.target, 'backPreview', 'backSuccess');

    // Cambiar vista previa visualmente al seleccionar modo
    document.getElementById('colorMode').onchange = function() {
        const previews = [document.getElementById('frontPreview'), document.getElementById('backPreview')];
        previews.forEach(p => {
            if(this.value === 'bw') p.classList.add('bn-filter');
            else p.classList.remove('bn-filter');
        });
    };

    // Función para generar el PDF (sin modificaciones de layout)
    document.getElementById('generateBtn').onclick = function() {
        const doc = new jsPDF('p', 'mm', 'a4');
        const isBW = document.getElementById('colorMode').value === 'bw';

        // Usamos la imagen base64 directamente. jsPDF maneja el filtro de color si lo deseamos, 
        // pero para B&N real y ahorro de tinta, el procesamiento de imagen en canvas (OpenCV) 
        // es mejor. Este script básico no lo incluye para mantener la simplicidad y rapidez.
        // El usuario puede configurar su impresora para B&N.

        // Medidas exactas: 8.5 x 5.5 cm (en mm es 85x55)
        const w = 85; 
        const h = 55;
        const xStart = 17.5; // Margen para centrar horizontalmente (210mm hoja - 175mm total) / 2
        const yStart = 40;   // Margen superior
        const gap = 5;       // Espacio entre fotos

        // Agregar imágenes al PDF
        doc.addImage(frontImg, 'JPEG', xStart, yStart, w, h);
        doc.addImage(backImg, 'JPEG', xStart + w + gap, yStart, w, h);

        // Abrir diálogo de impresión
        const pdfUrl = doc.output('bloburl');
        window.open(pdfUrl, '_blank');
    };
</script>

</body>
</html>
