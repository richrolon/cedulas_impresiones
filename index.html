<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador PDF Cédula - Rich Rolon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .upload-card { border: 2px solid #007bff; padding: 15px; border-radius: 15px; margin-bottom: 15px; background: #fcfdfe; position: relative; }
        img { width: 100%; max-width: 250px; display: none; margin: 15px auto; border-radius: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .bn-filter { filter: grayscale(100%); }
    </style>
</head>
<body>

<div class="container">
    <h2>Impresión de Cédula A4</h2>
    <p style="font-size: 0.9em; color: #666;">Selecciona las fotos de tu galería o cámara.</p>

    <div class="upload-card">
        <strong>📸 Lado Frontal</strong>
        <input type="file" id="frontInput" accept="image/*">
        <img id="frontPreview">
    </div>

    <div class="upload-card">
        <strong>📸 Lado Posterior</strong>
        <input type="file" id="backInput" accept="image/*">
        <img id="backPreview">
    </div>

    <div style="margin: 20px 0; text-align: left;">
        <label><b>Modo de Impresión:</b></label>
        <select id="colorMode">
            <option value="color">A Color</option>
            <option value="bw">Blanco y Negro</option>
        </select>
    </div>

    <button id="generateBtn" disabled>Descargar PDF A4</button>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    // Usamos el acceso directo de la librería
    const { jsPDF } = window.jspdf ? window.jspdf : {};
    
    let frontImg = null;
    let backImg = null;

    function handleFile(input, previewId) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById(previewId);
            preview.src = e.target.result;
            preview.style.display = 'block';
            
            if (previewId === 'frontPreview') frontImg = e.target.result;
            else backImg = e.target.result;

            if (frontImg && backImg) document.getElementById('generateBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('frontInput').onchange = (e) => handleFile(e.target, 'frontPreview');
    document.getElementById('backInput').onchange = (e) => handleFile(e.target, 'backPreview');

    document.getElementById('colorMode').onchange = function() {
        const previews = [document.getElementById('frontPreview'), document.getElementById('backPreview')];
        previews.forEach(p => {
            if(this.value === 'bw') p.classList.add('bn-filter');
            else p.classList.remove('bn-filter');
        });
    };

    // Procesamiento de imagen mejorado
    function processImage(base64, isBW) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('procCanvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                if (isBW) {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = (data[i] + data[i+1] + data[i+2]) / 3;
                        data[i] = data[i+1] = data[i+2] = gray;
                    }
                    ctx.putImageData(imageData, 0, 0);
                }
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = base64;
        });
    }

    document.getElementById('generateBtn').onclick = async function() {
        try {
            const btn = this;
            btn.innerText = "Procesando...";
            btn.disabled = true;

            const isBW = document.getElementById('colorMode').value === 'bw';
            const finalFront = await processImage(frontImg, isBW);
            const finalBack = await processImage(backImg, isBW);

            const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
            const w = 85; 
            const h = 55;
            const xStart = 17.5;
            const yStart = 40;
            const gap = 5;

            doc.addImage(finalFront, 'JPEG', xStart, yStart, w, h);
            doc.addImage(finalBack, 'JPEG', xStart + w + gap, yStart, w, h);

            // CAMBIO CLAVE: Descarga directa en lugar de abrir pestaña
            doc.save("cedula_imprimir.pdf");
            
            btn.innerText = "Descargar PDF A4";
            btn.disabled = false;
        } catch (error) {
            alert("Error al generar el PDF: " + error.message);
            console.error(error);
        }
    };
</script>

</body>
</html>
