<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador PDF Cédula - Rich Rolon</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f4f7f6; color: #333; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0056b3; }
        .info { font-size: 0.9em; color: #666; margin-bottom: 20px; }

        .upload-card { margin-bottom: 20px; text-align: left; }
        .upload-card strong { display: block; margin-bottom: 8px; color: #007bff; }

        .upload-btn-wrapper {
            position: relative; width: 100%; height: 150px; border: 2px dashed #ccc;
            border-radius: 12px; overflow: hidden; background-color: #f8fbff;
            display: flex; align-items: center; justify-content: center;
        }

        .esquema-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.3; z-index: 1;
        }

        /* URLs de tus imágenes esquema */
        #frontWrapper .esquema-overlay { background-image: url('esquema_frontal.png'); }
        #backWrapper .esquema-overlay { background-image: url('esquema_posterior.png'); }

        .upload-text { position: relative; z-index: 2; font-weight: bold; color: #007bff; }
        .upload-btn-wrapper input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 3; cursor: pointer; }
        .preview-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; z-index: 4; }

        .controls-section { margin-top: 30px; text-align: left; }
        select, button { width: 100%; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 10px; border: 1px solid #ccc; }
        #generateBtn { background: #28a745; color: white; border: none; cursor: pointer; }
        #generateBtn:disabled { background: #ccc; cursor: not-allowed; }
        .bn-filter { filter: grayscale(100%); }
    </style>
</head>
<body>

<div class="container">
    <h2>Impresión de Cédula A4</h2>
    <p class="info">Sube las fotos usando los esquemas como guía.</p>

    <div class="upload-card">
        <strong>📸 Lado Frontal</strong>
        <div id="frontWrapper" class="upload-btn-wrapper">
            <div class="esquema-overlay"></div>
            <span class="upload-text">Seleccionar Foto</span>
            <input type="file" id="frontInput" accept="image/*">
            <img id="frontPreview" class="preview-img">
        </div>
    </div>

    <div class="upload-card">
        <strong>📸 Lado Posterior</strong>
        <div id="backWrapper" class="upload-btn-wrapper">
            <div class="esquema-overlay"></div>
            <span class="upload-text">Seleccionar Foto</span>
            <input type="file" id="backInput" accept="image/*">
            <img id="backPreview" class="preview-img">
        </div>
    </div>

    <div class="controls-section">
        <label><b>Modo de Impresión:</b></label>
        <select id="colorMode">
            <option value="color">A Color</option>
            <option value="bw">Blanco y Negro</option>
        </select>
        <button id="generateBtn" disabled>Generar PDF A4</button>
    </div>
</div>

<!-- Canvas oculto para procesar el Blanco y Negro -->
<canvas id="canvasProcesador" style="display:none;"></canvas>

<script>
    const { jsPDF } = window.jspdf;
    let frontImgBase64 = null;
    let backImgBase64 = null;

    function handleFile(input, previewId) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById(previewId);
            preview.src = e.target.result;
            preview.style.display = 'block';
            input.parentElement.querySelector('.upload-text').style.display = 'none';

            if (previewId === 'frontPreview') frontImgBase64 = e.target.result;
            else backImgBase64 = e.target.result;

            if (frontImgBase64 && backImgBase64) document.getElementById('generateBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('frontInput').onchange = (e) => handleFile(e.target, 'frontPreview');
    document.getElementById('backInput').onchange = (e) => handleFile(e.target, 'backPreview');

    // Función que convierte una imagen a B&N real usando un Canvas
    function procesarImagenBN(base64) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('canvasProcesador');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    // Fórmula de luminosidad para gris: (0.3R + 0.59G + 0.11B)
                    const gris = data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
                    data[i] = data[i + 1] = data[i + 2] = gris;
                }
                ctx.putImageData(imageData, 0, 0);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = base64;
        });
    }

    document.getElementById('generateBtn').onclick = async function() {
    this.innerText = "Procesando...";
    const isBW = document.getElementById('colorMode').value === 'bw';
    
    const finalFront = isBW ? await procesarImagenBN(frontImgBase64) : frontImgBase64;
    const finalBack = isBW ? await procesarImagenBN(backImgBase64) : backImgBase64;

    const doc = new jsPDF('p', 'mm', 'a4');
    doc.addImage(finalFront, 'JPEG', 17.5, 40, 85, 55);
    doc.addImage(finalBack, 'JPEG', 107.5, 40, 85, 55);

    // MÉTODO COMPATIBLE CON IPHONE:
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        // En iOS, abrimos el PDF en una nueva pestaña para que Safari lo gestione
        const pdfData = doc.output('bloburl');
        window.location.href = pdfData; 
    } else {
        // En Android/PC, descargamos directamente
        doc.save("cedula_impresion.pdf");
    }
    
    this.innerText = "Generar PDF A4";
};

    // Filtro visual en pantalla
    document.getElementById('colorMode').onchange = function() {
        const previews = [document.getElementById('frontPreview'), document.getElementById('backPreview')];
        previews.forEach(p => {
            if(this.value === 'bw') p.classList.add('bn-filter');
            else p.classList.remove('bn-filter');
        });
    };
</script>

</body>
</html>
