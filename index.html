<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Cédula Pro - Rich Rolon</title>
    <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
    <script src="https://cdn.jsdelivr.net/gh/ColonelParrot/jscanify@master/src/jscanify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background: #f0f2f5; color: #1a1a1a; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .status-badge { background: #6c757d; color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.9em; margin-bottom: 20px; display: inline-block; font-weight: bold; }
        .upload-card { border: 2px dashed #007bff; padding: 20px; border-radius: 15px; margin-bottom: 15px; background: #f8fbff; cursor: pointer; }
        .upload-card:active { background: #eef5ff; }
        img { width: 100%; max-width: 280px; display: none; margin: 15px auto; border: 2px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 8px; }
        
        select, button { width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 10px; border: 1px solid #ddd; outline: none; }
        button { background: #007bff; color: white; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { background: #0056b3; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; box-shadow: none; }
        
        .instrucciones { font-size: 0.85em; color: #555; margin-bottom: 20px; text-align: left; background: #fff3cd; padding: 12px; border-radius: 10px; border-left: 5px solid #ffc107; }
        input[type="file"] { display: block; margin: 10px auto; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge">⏳ Cargando Sistema...</div>
    <h2>Impresión de Cédula A4</h2>
    
    <div class="instrucciones">
        📌 <b>Para un recorte perfecto:</b><br>
        • Coloca la cédula sobre un fondo oscuro.<br>
        • Al presionar "Seleccionar", elige <b>Cámara</b> para una foto nueva o <b>Galería</b> para una guardada.
    </div>

    <div class="upload-card">
        <strong>📸 Lado Frontal</strong>
        <input type="file" id="frontInput" accept="image/*">
        <img id="frontPreview">
    </div>

    <div class="upload-card">
        <strong>📸 Lado Posterior</strong>
        <input type="file" id="backInput" accept="image/*">
        <img id="backPreview">
    </div>

    <div style="margin: 20px 0; text-align: left;">
        <label><b>Modo de Impresión:</b></label>
        <select id="colorMode">
            <option value="color">A Color (Original)</option>
            <option value="bw">Blanco y Negro (Escala de Grises)</option>
        </select>
    </div>

    <button id="generateBtn" disabled>Generar e Imprimir PDF</button>
</div>

<script>
    const { jsPDF } = window.jspdf;
    let scanner;
    let frontCanvas = null;
    let backCanvas = null;

    // Inicializar OpenCV y jscanify
    var Module = {
        onRuntimeInitialized: function() {
            scanner = new jscanify();
            const badge = document.getElementById('status');
            badge.innerText = "✅ Sistema Listo";
            badge.style.background = "#28a745";
        }
    };

    async function processImage(input, previewId) {
        if (!scanner) return alert("Por favor, espera a que el sistema cargue.");
        const file = input.files[0];
        if (!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = function() {
            // El motor jscanify detecta el papel y aplica la transformación de perspectiva
            // Forzamos la proporción estándar de tarjeta de crédito/cédula (ID-1)
            const resultCanvas = scanner.extractPaper(img, 1011, 638); 
            
            const preview = document.getElementById(previewId);
            preview.src = resultCanvas.toDataURL('image/jpeg', 0.9);
            preview.style.display = 'block';

            if (previewId === 'frontPreview') frontCanvas = resultCanvas;
            else backCanvas = resultCanvas;

            if (frontCanvas && backCanvas) {
                document.getElementById('generateBtn').disabled = false;
            }
        };
    }
